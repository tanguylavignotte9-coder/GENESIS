<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:"
    />
    <title>GENESIS</title>
  </head>
  <body>
    <div id="map"></div>

    <div id="summary" class="panel" aria-live="polite">Démarrage…</div>

    <form id="world-form" class="panel" autocomplete="off">
      <label for="seed">Graine</label>
      <input id="seed" type="text" inputmode="numeric" placeholder="au hasard" spellcheck="false" />
      <button id="new-world" type="submit">Nouveau monde</button>
      <div id="form-error" class="form-error" hidden></div>
    </form>

    <div id="time" class="panel">
      <div id="date">…</div>
      <div id="speeds" class="speed-buttons">
        <button id="pause" type="button" title="Pause (Espace)">⏸</button>
      </div>
    </div>

    <section id="journal" class="panel">
      <button id="journal-toggle" type="button">▾ Journal</button>
      <ol id="journal-list"></ol>
    </section>

    <div id="follow" class="panel" hidden>
      <span id="follow-text"></span>
      <button id="follow-stop" type="button">Arrêter</button>
    </div>

    <button id="stats-toggle" class="panel" type="button">Statistiques</button>
    <section id="stats" class="panel" hidden>
      <div class="stats-title">Populations animales</div>
      <canvas id="stats-chart"></canvas>
      <div id="stats-legend"></div>
    </section>

    <div id="help" class="panel">
      Glisser ou ZQSD / flèches : se déplacer · Molette : zoomer · Espace : pause · 1 à 5 : vitesse · Clic sur un animal : le suivre
    </div>

    <div id="tooltip" class="panel" hidden></div>

    <div id="loading" hidden>
      <div class="panel loading-box">Génération du monde…</div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
