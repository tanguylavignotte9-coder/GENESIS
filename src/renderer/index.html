<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Genesis</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0e13;
        color: #d8dce6;
        font-family: 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; }
      #barre {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 44px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        background: rgba(13, 16, 24, 0.92);
        border-bottom: 1px solid #232a3a;
        z-index: 10;
        user-select: none;
      }
      #barre .titre { font-weight: 600; letter-spacing: 1px; margin-right: 12px; color: #e8b64c; }
      #barre button {
        background: #1a2030;
        color: #d8dce6;
        border: 1px solid #2c3550;
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
        font-size: 13px;
      }
      #barre button:hover { background: #243050; }
      #barre button.actif { background: #e8b64c; color: #14100a; border-color: #e8b64c; font-weight: 600; }
      #date { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; color: #9fb0d0; }
      #journal {
        position: fixed;
        top: 44px; right: 0; bottom: 0;
        width: 320px;
        background: rgba(11, 14, 19, 0.92);
        border-left: 1px solid #232a3a;
        z-index: 9;
        display: flex;
        flex-direction: column;
      }
      #journal h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #9fb0d0;
        margin: 0;
        padding: 10px 12px;
        border-bottom: 1px solid #232a3a;
      }
      #listeJournal { flex: 1; overflow-y: auto; padding: 6px 0; }
      #fiche {
        position: fixed;
        top: 44px; left: 0; bottom: 0;
        width: 340px;
        background: rgba(11, 14, 19, 0.95);
        border-right: 1px solid #232a3a;
        z-index: 9;
        display: none;
        flex-direction: column;
        padding: 10px 14px;
        overflow-y: auto;
        font-size: 13px;
      }
      #fiche h2 { font-size: 14px; color: #e8b64c; margin: 0 0 8px 0; }
      #fiche .ligne { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #161b28; }
      #fiche .ligne .cle { color: #9fb0d0; }
      #ficheFermer { margin-top: 10px; background: #1a2030; color: #d8dce6; border: 1px solid #2c3550; border-radius: 4px; padding: 6px; cursor: pointer; }
      .evenement { padding: 6px 12px; border-bottom: 1px solid #161b28; font-size: 12px; }
      .evenement .date { color: #6f7ea0; margin-right: 6px; }
      .evenement .type { color: #e8b64c; margin-right: 6px; }
      #ecranErreur {
        position: fixed; inset: 0; z-index: 100;
        background: #14100a; color: #f0d9a8;
        display: none; padding: 40px; overflow: auto;
      }
      #ecranErreur h1 { color: #e8b64c; font-size: 20px; }
      #ecranErreur pre { white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
      #ecranDemarrage {
        position: fixed; inset: 0; z-index: 50;
        background: rgba(11, 14, 19, 0.96);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      }
      #ecranDemarrage h1 { color: #e8b64c; letter-spacing: 3px; font-size: 34px; margin: 0; }
      #ecranDemarrage label { font-size: 13px; color: #9fb0d0; margin-top: 6px; }
      #ecranDemarrage input {
        background: #1a2030; border: 1px solid #2c3550; color: #d8dce6;
        border-radius: 4px; padding: 7px 10px; font-size: 14px; width: 220px; text-align: center;
      }
      #ecranDemarrage button {
        background: #e8b64c; color: #14100a; border: none; border-radius: 4px;
        padding: 9px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="barre" style="display: none">
      <span class="titre">GENESIS</span>
      <button id="btnPause" title="Pause">⏸ Pause</button>
      <button id="btnX1" class="vitesse actif">×1</button>
      <button id="btnX5" class="vitesse">×5</button>
      <button id="btnX10" class="vitesse">×10</button>
      <button id="btnX25" class="vitesse">×25</button>
      <button id="btnX50" class="vitesse">×50</button>
      <button id="btnSauvegarder" title="Sauvegarder (slot auto)">💾 Sauvegarder</button>
      <button id="btnCharger" title="Reprendre la sauvegarde auto">📂 Reprendre</button>
      <span id="date"></span>
    </div>
    <div id="journal" style="display: none">
      <h2>Journal <select id="filtreJournal" style="background:#1a2030;color:#d8dce6;border:1px solid #2c3550;border-radius:4px;font-size:11px;margin-left:8px;">
        <option value="">tous</option>
        <option value="naissance">naissances</option>
        <option value="mort">morts</option>
        <option value="fondation">fondations</option>
        <option value="drame">drames</option>
        <option value="monde">monde</option>
        <option value="autre">autre</option>
      </select></h2>
      <div id="listeJournal"></div>
    </div>
    <div id="fiche" style="display: none">
      <h2 id="ficheTitre">Individu</h2>
      <div id="ficheContenu"></div>
      <button id="ficheFermer">Fermer</button>
    </div>
    <div id="ecranDemarrage">
      <h1>GENESIS</h1>
      <label for="inputSeed">Graine du monde</label>
      <input id="inputSeed" type="number" value="42" />
      <label for="inputBandes">Nombre de bandes initiales</label>
      <input id="inputBandes" type="number" value="3" />
      <label for="inputTailleBande">Taille de chaque bande (individus)</label>
      <input id="inputTailleBande" type="number" value="15" />
      <button id="btnLancer">Générer le monde</button>
    </div>
    <div id="ecranErreur">
      <h1>Impossible de démarrer : configuration invalide</h1>
      <pre id="erreursConfig"></pre>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
